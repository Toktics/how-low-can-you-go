<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/png" href="./images/icon.png" />
    <link rel="apple-touch-icon" href="./images/icon.png" />
    <!-- Fredoka is the splash's first font choice — preloading it makes the
         boot splash and title render on-brand instead of a swap flash. -->
    <link rel="preload" href="./fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="canonical" href="https://snappyfoxgames.co.uk" />
    <meta name="description" content="How Low Can You Go? — a Snappy Fox Games title." />
    <title>How Low Can You Go?</title>
    <!-- Poki SDK — loaded unconditionally so the same build serves the site and
         the portal; PlatformBridge no-ops when the SDK is absent. -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <script type="module" crossorigin src="./assets/index-B7edge01.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cg9zzPi5.css">
  </head>
  <body>
    <!-- Instant boot splash: pure HTML/CSS so it paints before the JS bundle
         downloads on slow connections. Removed when the game signals it is
         paintable (same moment as Poki's gameLoadingFinished). -->
    <div id="boot-splash" role="status" aria-live="polite" aria-label="How Low Can You Go? loading">
      <img class="bs-logo" src="./images/how-low-can-you-go-logo.webp" alt="How Low Can You Go?" />
      <div class="bs-gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading progress">
        <div class="bs-fill" id="bs-fill"></div>
        <div class="bs-ticks" aria-hidden="true"></div>
        <div class="bs-sheen" aria-hidden="true"></div>
      </div>
      <div class="bs-depth" id="bs-depth">0m</div>
    </div>
    <style>
      /* Fredoka (OFL — license in public/fonts/OFL.txt) — self-hosted because
         the portals forbid external requests. Declared here, not in the bundled
         CSS, so ./fonts resolves relative to the PAGE under any deploy subpath. */
      @font-face {
        font-family: "Fredoka";
        src: url("./fonts/fredoka-latin.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fredoka";
        src: url("./fonts/fredoka-latin-ext.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      #boot-splash {
        position: fixed; inset: 0; z-index: 999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 30px; background: #0b0a10; color: #ffd76a;
        font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
        transition: opacity 0.25s ease;
      }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      .bs-logo { width: min(72vw, 380px); height: auto; }
      .bs-gauge {
        width: min(64vw, 300px); height: 18px; border-radius: 10px;
        background: #171521; border: 2px solid #37324a;
        overflow: hidden; position: relative;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05);
      }
      .bs-fill {
        height: 100%; width: 0%;
        background: linear-gradient(180deg, #ffe9a8 0%, #ffd76a 45%, #e8b23a 100%);
        box-shadow: 0 0 10px rgba(255, 215, 106, 0.45);
        transition: width 0.2s ease-out;
      }
      .bs-ticks {
        position: absolute; inset: 0;
        background: repeating-linear-gradient(90deg,
          transparent 0 14px, rgba(11,10,16,0.55) 14px 16px);
      }
      .bs-sheen {
        position: absolute; inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.16) 48%, transparent 62%);
        background-size: 250% 100%;
        animation: bs-sheen 1.6s linear infinite;
      }
      @keyframes bs-sheen {
        0% { background-position: 120% 0; }
        100% { background-position: -40% 0; }
      }
      .bs-depth { font-size: 17px; font-weight: 700; color: #ffd76a; letter-spacing: 0.06em; }
      @media (prefers-reduced-motion: reduce) {
        .bs-sheen { animation: none; }
      }
    </style>
    <script>
      // Loading expressed as a descent: 0% = 0m, 100% = 100,000m. The bar
      // crawls to 65% while the JS bundle is in flight (the honest floor);
      // __bootProgress then reports real BOOT-tier progress and completion.
      (function () {
        var fill = document.getElementById("bs-fill");
        var depth = document.getElementById("bs-depth");
        var gauge = document.querySelector(".bs-gauge");
        var shown = 0, target = 0, start = performance.now();
        window.__bootP = 0;
        window.__bootProgress = function (p) { window.__bootP = p * 100; };
        function tick(now) {
          var t = Math.min(1, (now - start) / 4500);
          var crawl = 65 * (1 - Math.pow(1 - t, 2));
          target = Math.max(crawl, window.__bootP);
          shown += (target - shown) * 0.14;
          var p = Math.min(100, shown);
          fill.style.width = p + "%";
          depth.textContent = Math.round(p * 1000).toLocaleString("en-GB") + "m";
          gauge.setAttribute("aria-valuenow", String(Math.round(p)));
          if (!document.getElementById("boot-splash")) return;
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
